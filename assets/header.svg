<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Jonathan Molina, Software Developer</title>
  <desc id="description">A dark blue technology-inspired banner with Jonathan Molina's name and professional focus.</desc>
  <defs>
    <linearGradient id="background" x1="40" y1="24" x2="1160" y2="296" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071426"/>
      <stop offset="0.52" stop-color="#102A56"/>
      <stop offset="1" stop-color="#251B55"/>
    </linearGradient>
    <linearGradient id="accent" x1="240" y1="92" x2="930" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.52" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(968 72) rotate(141) scale(385 238)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#C4E7FF" stroke-opacity="0.055"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#background)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="28" fill="url(#glow)"/>

  <circle cx="1070" cy="70" r="108" fill="#22D3EE" fill-opacity="0.09" filter="url(#blur)"/>
  <circle cx="1000" cy="268" r="124" fill="#A78BFA" fill-opacity="0.12" filter="url(#blur)"/>

  <g opacity="0.72">
    <path d="M970 83L915 138L970 193" stroke="#22D3EE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1060 83L1115 138L1060 193" stroke="#A78BFA" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1038 62L990 214" stroke="#60A5FA" stroke-width="9" stroke-linecap="round"/>
  </g>

  <rect x="78" y="56" width="188" height="34" rx="17" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.45"/>
  <circle cx="101" cy="73" r="5" fill="#22D3EE"/>
  <text x="118" y="79" fill="#BAF4FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="1.4">BOGOTÁ, COLOMBIA</text>

  <text x="76" y="158" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="57" font-weight="750" letter-spacing="-1.6">Jonathan Molina</text>
  <rect x="78" y="181" width="540" height="4" rx="2" fill="url(#accent)"/>
  <text x="78" y="230" fill="#C8D7EE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="500" letter-spacing="0.4">Software Developer · Product Engineering · Cloud</text>
  <text x="78" y="270" fill="#8FA9CC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17">Angular  /  TypeScript  /  React  /  NestJS  /  AWS</text>

  <rect x="1" y="1" width="1198" height="318" rx="27" stroke="url(#accent)" stroke-opacity="0.32" stroke-width="2"/>
</svg>
